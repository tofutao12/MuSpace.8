<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ahtao Muspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script>
        // ================= ตำราเวทมนตร์ (ตั้งค่าเริ่มต้น) =================
        const defaultWebConfig = {
            profileImage: "download (73).jpg", 
            bannerImage: "download (74).jpg",  
            musicFile: "wings_of_gold.mp3", 
            
            siteTitle: "Ahtao Muspace",
            siteSubtitle: "ผู้เปิดประตูสู่พรสวรรค์และความโชคดี",

            links: {
                tarot: { text: "🔮 เปิดไพ่ดูดวง", url: "#" },
                reviews: { text: "📜 รีวิวจากลูกค้า", url: "#" },
                discord: { text: "🎧 Discord", url: "#" },
                facebook: { text: "📘 Facebook", url: "#" },
                line: { text: "💬 LINE Official", url: "#" },
                instagram: { text: "📸 Instagram", url: "#" }
            }
        };
    </script>
    
    <style>
        /* ================= โทนสีสว่าง ละมุนตา (Light Ethereal Theme) ================= */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Prompt', sans-serif; 
            background: #fcf9ff; 
            color: #5a3a7c;
            min-height: 100vh; display: flex; justify-content: center;
            overflow-x: hidden; overscroll-behavior-y: none;
        }
        
        .bg-gradient {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #f3e6ff, #e2c2f0, #fcf9ff, #e8d0f5);
            background-size: 400% 400%; animation: gradientBG 20s ease infinite; z-index: -2;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* แคนวาสละอองดาวแฉกวิบวับ */
        #stardustCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 100; }

        .container {
            width: 100%; max-width: 480px; padding: 20px; text-align: center;
            position: relative; z-index: 1; min-height: 100vh;
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(12px);
            box-shadow: 0 0 40px rgba(180, 140, 220, 0.2);
            opacity: 0; transition: opacity 1.2s ease-in-out;
        }

        .banner {
            width: 100%; height: 240px; border-radius: 25px; margin-bottom: -70px;
            box-shadow: 0 15px 35px rgba(160, 100, 220, 0.25); 
            border: 3px solid rgba(255, 255, 255, 0.7);
            position: relative; overflow: hidden; transform: translateZ(0);
        }
        .banner-bg {
            position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px;
            background-position: center; background-size: cover;
            animation: breathBanner 10s ease-in-out infinite alternate;
        }
        @keyframes breathBanner { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }

        .profile-img {
            width: 150px; height: 150px; border-radius: 50%; 
            border: 5px solid rgba(255, 255, 255, 0.9);
            object-fit: cover; position: relative; z-index: 5;
            box-shadow: 0 10px 30px rgba(160, 32, 240, 0.3), inset 0 0 20px rgba(255,255,255,1);
            cursor: pointer; transition: transform 0.3s;
        }
        .profile-img:active { transform: scale(0.95); }

        /* ================= ชื่อเว็บหรูหรา สีสว่างละมุน ================= */
        .title { 
            font-family: 'Cinzel', serif; font-size: 34px; margin-top: 15px; 
            color: #7b4397; 
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
            letter-spacing: 1.5px;
        }
        .subtitle { 
            font-size: 14px; color: #8a63a8; margin-bottom: 30px; 
            letter-spacing: 1.5px; font-weight: 400;
        }

        /* ================= ปุ่มคริสตัลแก้วสว่างสดใส ================= */
        .links-container { display: flex; flex-direction: column; gap: 16px; position: relative; z-index: 5; }
        .link-btn {
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.9); padding: 18px 20px; border-radius: 35px;
            color: #5f337c; text-decoration: none; font-size: 16px; font-weight: 600;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(160, 32, 240, 0.1), inset 0 0 15px rgba(255,255,255,0.8);
            position: relative; overflow: hidden; animation: breathing 4s infinite ease-in-out alternate;
            transition: all 0.3s ease;
        }
        .link-btn::after {
            content: ''; position: absolute; top: -50%; left: -100%;
            width: 50%; height: 200%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.8), transparent);
            transform: skewX(-30deg); transition: 0.6s ease;
        }
        .link-btn:hover::after { left: 150%; }
        .link-btn:hover { 
            border-color: #d8b8eb; background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 25px rgba(226, 194, 240, 0.8); 
            transform: translateY(-3px) scale(1.02); color: #7b4397;
        }
        .link-btn:nth-child(even) { animation-delay: 1s; } .link-btn:nth-child(3n) { animation-delay: 2s; }
        @keyframes breathing { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }

        /* หน้าจอโหลดสีสว่างละมุน */
        #loadingScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #fcf9ff;
            z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .magic-circle {
            width: 90px; height: 90px; border: 4px dashed #c09cd4; border-radius: 50%;
            animation: spin 3s linear infinite; box-shadow: 0 0 25px rgba(192, 156, 212, 0.5);
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #gestureOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(252, 249, 255, 0.95);
            z-index: 9998; display: none; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.5s; backdrop-filter: blur(10px);
        }
        #gestureOverlay h2 { color: #7b4397; font-family: 'Cinzel'; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255,255,255,0.8); }
        #drawCanvas { border: 2px solid rgba(192, 156, 212, 0.6); border-radius: 20px; box-shadow: 0 0 30px rgba(192,156,212,0.3); background: rgba(255,255,255,0.7); cursor: crosshair; touch-action: none; }

        #adminPanel {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.5); z-index: 9999; justify-content: center; align-items: center; padding: 15px;
            opacity: 0; transition: opacity 0.5s; backdrop-filter: blur(5px);
        }
        .admin-box {
            background: rgba(255, 255, 255, 0.95); width: 100%; max-width: 400px; padding: 25px; 
            border-radius: 20px; border: 3px solid #d8b8eb; max-height: 90vh; overflow-y: auto; text-align: left; 
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }
        .admin-box h2 { color: #7b4397; text-align: center; margin-bottom: 15px; border-bottom: 2px solid #f3e6ff; padding-bottom: 10px; }
        .admin-group { margin-bottom: 12px; }
        .admin-group label { display: block; font-size: 13px; color: #8a63a8; margin-bottom: 4px; font-weight: 600;}
        .admin-group input {
            width: 100%; padding: 10px; border-radius: 8px; border: 2px solid #e2c2f0; background: #fff;
            color: #5a3a7c; font-family: 'Prompt'; outline: none; transition: 0.3s;
        }
        .admin-group input:focus { border-color: #b983d6; box-shadow: 0 0 10px rgba(185, 131, 214, 0.3); }
        .admin-btn {
            width: 100%; padding: 12px; background: linear-gradient(90deg, #b983d6, #7b4397); color: white;
            border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s;
            font-family: 'Prompt';
        }
        .admin-btn:hover { background: #d8b8eb; color: #5a3a7c; box-shadow: 0 5px 15px rgba(123, 67, 151, 0.3); }
        .admin-btn.close-btn { background: #fff; border: 2px solid #ff6b6b; color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <div id="loadingScreen">
        <div class="magic-circle"></div>
        <p style="color: #7b4397; margin-top: 20px; font-family: 'Cinzel';">Summoning Magic...</p>
    </div>

    <!-- แคนวาสละอองดาวแฉกวิบวับ -->
    <canvas id="stardustCanvas"></canvas>

    <div class="container" id="mainContainer">
        <div class="banner">
            <div class="banner-bg" id="bannerBg"></div>
        </div>
        
        <img src="" alt="Profile" class="profile-img" id="profileImg">
        
        <h1 class="title" id="siteTitle">Title</h1>
        <p class="subtitle" id="siteSubtitle">Subtitle</p>

        <div class="links-container" id="linksContainer"></div>

        <audio id="bgMusic" loop>
            <source src="" type="audio/mpeg" id="musicSource">
        </audio>
    </div>

    <div id="gestureOverlay">
        <h2>Draw Infinity (8) to Unlock</h2>
        <canvas id="drawCanvas" width="300" height="300"></canvas>
        <button class="admin-btn close-btn" style="max-width: 300px; margin-top:20px;" onclick="closeGesture()">Cancel Spell</button>
    </div>

    <div id="adminPanel">
        <div class="admin-box">
            <h2>📖 The Secret Grimoire</h2>
            <div class="admin-group"><label>Profile Image File</label><input type="text" id="adminProfImg"></div>
            <div class="admin-group"><label>Banner Image File</label><input type="text" id="adminBanImg"></div>
            <div class="admin-group"><label>Title</label><input type="text" id="adminTitle"></div>
            <div class="admin-group"><label>Subtitle</label><input type="text" id="adminSubtitle"></div>
            <h3 style="color:#7b4397; font-size:14px; margin: 15px 0 5px; border-bottom: 1px solid #f3e6ff; padding-bottom:5px;">🔗 Links Settings</h3>
            <div id="adminLinksArea"></div>
            <button class="admin-btn" onclick="saveAdminData()">💾 บันทึกเวทมนตร์ (Save Config)</button>
            <button class="admin-btn close-btn" onclick="closeAdmin()">❌ ปิดตำรา</button>
        </div>
    </div>

    <script>
        try {
            let currentData = defaultWebConfig;
            if (localStorage.getItem('ahtao_magic_v3')) { currentData = JSON.parse(localStorage.getItem('ahtao_magic_v3')); }

            function renderSite() {
                document.getElementById('profileImg').src = currentData.profileImage;
                document.getElementById('bannerBg').style.backgroundImage = `url('${currentData.bannerImage}')`;
                document.getElementById('siteTitle').innerText = currentData.siteTitle;
                document.getElementById('siteSubtitle').innerText = currentData.siteSubtitle;
                
                const linksContainer = document.getElementById('linksContainer');
                linksContainer.innerHTML = ''; 
                for (const key in currentData.links) {
                    const linkData = currentData.links[key];
                    const a = document.createElement('a');
                    a.href = linkData.url; a.className = 'link-btn'; a.innerText = linkData.text;
                    linksContainer.appendChild(a);
                }
            }
            renderSite();

            const bgMusic = document.getElementById('bgMusic');
            document.getElementById('musicSource').src = currentData.musicFile;
            bgMusic.load(); let musicPlayed = false;
            
            function playMagicMusic() {
                if (!musicPlayed) { bgMusic.volume = 0.4; bgMusic.play().then(() => { musicPlayed = true; }).catch(e => {}); }
            }
            window.addEventListener('touchstart', playMagicMusic, { once: true });
            window.addEventListener('click', playMagicMusic, { once: true });
            window.addEventListener('scroll', playMagicMusic, { once: true });

            // ป้องกันหน้าจอโหลดค้าง
            window.addEventListener('load', () => {
                setTimeout(() => {
                    const loader = document.getElementById('loadingScreen');
                    loader.style.opacity = '0';
                    setTimeout(() => { 
                        loader.style.display = 'none'; 
                        document.getElementById('mainContainer').style.opacity = '1';
                    }, 800);
                }, 500);
            });

            // ================= ระบบประกายดาวแฉกวิบวับ (โทนสว่าง) =================
            const canvas = document.getElementById('stardustCanvas'); 
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
            
            let sparkles = [];
            for(let i=0; i<40; i++) {
                sparkles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2.5 + 1,
                    alpha: Math.random(),
                    speedAlpha: Math.random() * 0.02 + 0.005,
                    vx: (Math.random() - 0.5) * 0.2,
                    vy: -Math.random() * 0.4 - 0.1
                });
            }

            window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

            function drawSparkle(x, y, size, alpha) {
                ctx.save();
                ctx.translate(x, y);
                ctx.fillStyle = `rgba(130, 80, 180, ${alpha * 0.8})`;
                ctx.shadowColor = "#d8b8eb";
                ctx.shadowBlur = 8;
                
                ctx.beginPath();
                ctx.moveTo(0, -size * 2);
                ctx.quadraticCurveTo(0, 0, size * 2, 0);
                ctx.quadraticCurveTo(0, 0, 0, size * 2);
                ctx.quadraticCurveTo(0, 0, -size * 2, 0);
                ctx.quadraticCurveTo(0, 0, 0, -size * 2);
                ctx.fill();
                ctx.restore();
            }

            function addSparkle(x, y) {
                sparkles.push({
                    x: x, y: y,
                    size: Math.random() * 3 + 1.5,
                    alpha: 1,
                    speedAlpha: 0.04,
                    vx: (Math.random() - 0.5) * 1,
                    vy: (Math.random() - 0.5) * 1
                });
            }
            window.addEventListener('mousemove', (e) => { if(Math.random()<0.3) addSparkle(e.clientX, e.clientY); });
            window.addEventListener('touchmove', (e) => { if(e.touches.length > 0 && Math.random()<0.3) addSparkle(e.touches[0].clientX, e.touches[0].clientY); });

            function animateSparkles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if(sparkles.length < 55 && Math.random() < 0.2) {
                    sparkles.push({
                        x: Math.random() * canvas.width,
                        y: canvas.height + 10,
                        size: Math.random() * 2 + 1,
                        alpha: 0,
                        speedAlpha: Math.random() * 0.02 + 0.005,
                        vx: (Math.random() - 0.5) * 0.2,
                        vy: -Math.random() * 0.5 - 0.1
                    });
                }

                for (let i = 0; i < sparkles.length; i++) {
                    let s = sparkles[i];
                    drawSparkle(s.x, s.y, s.size, s.alpha);
                    
                    s.x += s.vx;
                    s.y += s.vy;
                    s.alpha += s.speedAlpha;
                    
                    if (s.alpha >= 1 || s.alpha <= 0) {
                        s.speedAlpha = -s.speedAlpha;
                    }
                }
                sparkles = sparkles.filter(s => s.y > -20 && s.alpha > 0);
                requestAnimationFrame(animateSparkles);
            }
            animateSparkles();

            const bannerBg = document.getElementById('bannerBg');
            window.addEventListener('scroll', () => { bannerBg.style.transform = `translateY(${window.scrollY * 0.25}px) scale(1.05)`; });

            let tapCount = 0;
            document.getElementById('profileImg').addEventListener('click', () => {
                tapCount++; if (tapCount === 2) { openGesture(); tapCount = 0; }
                setTimeout(() => { tapCount = 0; }, 1000);
            });

            const gestureOverlay = document.getElementById('gestureOverlay');
            const dCanvas = document.getElementById('drawCanvas'); const dCtx = dCanvas.getContext('2d');
            let isDrawing = false; let pathLength = 0; let lastPos = {x:0, y:0};

            function openGesture() {
                gestureOverlay.style.display = 'flex'; setTimeout(() => { gestureOverlay.style.opacity = '1'; }, 50);
                dCtx.clearRect(0, 0, dCanvas.width, dCanvas.height); pathLength = 0;
                dCtx.lineWidth = 10; dCtx.strokeStyle = "rgba(185, 131, 214, 0.3)"; dCtx.lineCap = "round";
                dCtx.beginPath(); dCtx.moveTo(150, 150); dCtx.bezierCurveTo(250, 50, 50, 50, 150, 150); dCtx.bezierCurveTo(250, 250, 50, 250, 150, 150); dCtx.stroke();
            }
            function closeGesture() { gestureOverlay.style.opacity = '0'; setTimeout(() => { gestureOverlay.style.display = 'none'; }, 500); }

            function startDraw(e) { 
                isDrawing = true; let rect = dCanvas.getBoundingClientRect();
                lastPos = { x: (e.touches ? e.touches[0].clientX : e.clientX) - rect.left, y: (e.touches ? e.touches[0].clientY : e.clientY) - rect.top };
            }
            function drawMove(e) {
                if (!isDrawing) return; e.preventDefault(); let rect = dCanvas.getBoundingClientRect();
                let currentPos = { x: (e.touches ? e.touches[0].clientX : e.clientX) - rect.left, y: (e.touches ? e.touches[0].clientY : e.clientY) - rect.top };
                dCtx.lineWidth = 6; dCtx.strokeStyle = "#7b4397"; dCtx.shadowColor = "#d8b8eb"; dCtx.shadowBlur = 10;
                dCtx.beginPath(); dCtx.moveTo(lastPos.x, lastPos.y); dCtx.lineTo(currentPos.x, currentPos.y); dCtx.stroke();
                pathLength += Math.hypot(currentPos.x - lastPos.x, currentPos.y - lastPos.y); lastPos = currentPos;
            }
            function stopDraw() {
                isDrawing = false;
                if (pathLength > 250) { closeGesture(); openAdmin(); } else { dCtx.clearRect(0, 0, dCanvas.width, dCanvas.height); openGesture(); }
            }
            dCanvas.addEventListener('mousedown', startDraw); dCanvas.addEventListener('mousemove', drawMove); dCanvas.addEventListener('mouseup', stopDraw);
            dCanvas.addEventListener('touchstart', startDraw, {passive: false}); dCanvas.addEventListener('touchmove', drawMove, {passive: false}); dCanvas.addEventListener('touchend', stopDraw);

            const adminPanel = document.getElementById('adminPanel'); const adminLinksArea = document.getElementById('adminLinksArea');

            function openAdmin() {
                adminPanel.style.display = 'flex'; setTimeout(() => { adminPanel.style.opacity = '1'; }, 50);
                document.getElementById('adminProfImg').value = currentData.profileImage;
                document.getElementById('adminBanImg').value = currentData.bannerImage;
                document.getElementById('adminTitle').value = currentData.siteTitle;
                document.getElementById('adminSubtitle').value = currentData.siteSubtitle;
                
                adminLinksArea.innerHTML = '';
                for (const key in currentData.links) {
                    adminLinksArea.innerHTML += `
                        <div class="admin-group">
                            <label>[${key}]</label>
                            <input type="text" id="t_${key}" value="${currentData.links[key].text}" style="margin-bottom:5px;" placeholder="ชื่อปุ่ม">
                            <input type="text" id="u_${key}" value="${currentData.links[key].url}" placeholder="ลิงก์">
                        </div>`;
                }
            }
            function closeAdmin() { adminPanel.style.opacity = '0'; setTimeout(() => { adminPanel.style.display = 'none'; }, 500); }

            window.saveAdminData = function() {
                currentData.profileImage = document.getElementById('adminProfImg').value;
                currentData.bannerImage = document.getElementById('adminBanImg').value;
                currentData.siteTitle = document.getElementById('adminTitle').value;
                currentData.siteSubtitle = document.getElementById('adminSubtitle').value;
                for (const key in currentData.links) {
                    currentData.links[key].text = document.getElementById(`t_${key}`).value;
                    currentData.links[key].url = document.getElementById(`u_${key}`).value;
                }
                localStorage.setItem('ahtao_magic_v3', JSON.stringify(currentData));
                renderSite(); closeAdmin(); alert("✨ บันทึกเวทมนตร์เรียบร้อยแล้ว!");
            }
            window.closeGesture = closeGesture; window.closeAdmin = closeAdmin;

        } catch (error) { console.error("ระบบเวทมนตร์ขัดข้อง:", error); }
    </script>
</body>
</html>
